services:
  nginx:
    image: nginx
    build: requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception_network
    restart: always

  wordpress:
    image: wordpress
    build: requirements/wordpress
    container_name: wordpress
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    environment:
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - inception_network
    restart: always
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

  mariadb:
    image: mariadb
    build: requirements/mariadb
    container_name: mariadb
    volumes:
      - database:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME}
      - MYSQL_USER=${WORDPRESS_DB_USER}
    networks:
      - inception_network
    restart: always
    secrets:
      - db_password
      - db_root_password
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost --password=$(cat /run/secrets/db_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  inception_network:
    driver: bridge

volumes:
  database:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: /home/ferda-si/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: /home/ferda-si/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt